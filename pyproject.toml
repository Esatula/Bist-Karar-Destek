[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bist-bot"
version = "0.1.0"
description = "BIST yarı-otonom alım-satım karar destek sistemi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "feedparser>=6.0.11",
    "tradingview-ta>=3.3.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]
llm = [
    "llama-cpp-python>=0.3.0",
]

[tool.setuptools.packages.find]
include = [
    "config*",
    "data*",
    "indicators*",
    "signals*",
    "backtest*",
    "news*",
    "portfolio*",
    "ui*",
]
exclude = ["tests*", "scripts*", "tools*", "venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
